<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 200" width="100%" height="auto">
  <defs>
    <style>
      @keyframes fadeSlide {
        0% { opacity: 0; transform: translateY(-10px); }
        100% { opacity: 1; transform: translateY(0); }
      }
      .texto {
        font-family: 'Segoe UI', Arial, sans-serif;
        fill: #1e293b;
        animation: fadeSlide 1.5s ease-out forwards;
      }
      .frase {
        font-size: 28px;
        font-weight: 300;
        letter-spacing: 1px;
      }
      .subtitulo {
        font-size: 18px;
        font-weight: 300;
        fill: #475569;
        letter-spacing: 0.5px;
      }
      .fondo {
        fill: #f8fafc;
        rx: 12;
      }
      .linea {
        stroke: #cbd5e1;
        stroke-width: 1;
      }
    </style>
  </defs>
  <rect class="fondo" width="800" height="200" />
  <line x1="60" y1="140" x2="740" y2="140" class="linea" />
  <!-- Solo la frase principal, sin nombre -->
  <text x="400" y="85" text-anchor="middle" class="texto frase">
    Software Engineering Student
  </text>
  <text x="400" y="120" text-anchor="middle" class="texto subtitulo">
    Web · Databases · User-Centered Solutions
  </text>
</svg>
