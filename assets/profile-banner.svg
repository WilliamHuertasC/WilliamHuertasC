<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 200" width="100%" height="auto">
  <defs>
    <style>
      @keyframes fadeSlide {
        0% { opacity: 0; transform: translateY(-10px); }
        100% { opacity: 1; transform: translateY(0); }
      }
      .texto {
        font-family: 'Segoe UI', Arial, sans-serif;
        fill: #1e293b;
        animation: fadeSlide 1.5s ease-out forwards;
      }
      .nombre {
        font-size: 42px;
        font-weight: 600;
        letter-spacing: 1px;
      }
      .frase {
        font-size: 18px;
        font-weight: 300;
        fill: #475569;
        letter-spacing: 0.5px;
      }
      .fondo {
        fill: #f8fafc;
        rx: 12;
      }
    </style>
  </defs>
  <!-- Fondo sutil -->
  <rect class="fondo" width="800" height="200" />
  <!-- Línea decorativa -->
  <line x1="40" y1="140" x2="760" y2="140" stroke="#cbd5e1" stroke-width="1" />
  <!-- Texto principal -->
  <text x="400" y="80" text-anchor="middle" class="texto nombre">
    Jheremy William Huertas Cabanillas
  </text>
  <text x="400" y="120" text-anchor="middle" class="texto frase">
    Software Engineering Student | Web, Databases &amp; User-Centered Solutions
  </text>
</svg>